<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Choix de l'algorithme de recommandation</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #6dd5fa, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 40px;
            font-size: 36px;
        }
        .card-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
        }
        .card {
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            width: 300px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-10px);
        }
        .card img {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 22px;
            color: #333;
            margin-bottom: 15px;
        }
        .card p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .card button {
            background-color: #1e90ff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }
        .card button:hover {
            background-color: #0f78d1;
        }
        @media screen and (max-width: 768px) {
            .card-container {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>

    <h1>Choisissez un algorithme de recommandation</h1>

    <div class="card-container">
        <div class="card">
            <img src="https://cdn-icons-png.flaticon.com/512/2983/2983067.png" alt="KNN">
            <h2>KNN</h2>
            <p>Recommandez les étudiants similaires selon les centres d’intérêt, compétences et interactions.</p>
            <a href="/knn"><button type="button">Utiliser KNN</button></a>
        </div>
        <div class="card">
            <img src="https://cdn-icons-png.flaticon.com/512/3313/3313887.png" alt="Co_Clustering">
            <h2>Co-Clustering</h2>
            <p>Regroupez les étudiants en classes avec des attributs similaires selon l'algorithme de co-clustering.</p>
            <a href="/co_clustering_interface"><button type="button">Utiliser Co-Clustering</button></a>
        </div>
    </div>

</body>
</html>
