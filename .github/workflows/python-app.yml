name: Build and Test Dockerized FastAPI App

on:
  push:
    branches: [ Salma-KNN ]
  pull_request:
    branches: [ Salma-KNN ]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build -t salma-knn-app .

    - name: Run Docker container
      run: |
        docker run -d -p 8000:8000 --name knn-app salma-knn-app
        sleep 5

    - name: Test FastAPI endpoint
      run: |
        curl http://localhost:8000/docs

    - name: Stop container
      run: |
        docker stop knn-app
        docker rm knn-app
