name: Docker Build and Push

on:
  push:
    branches:
      - KNN-taha
  pull_request:
    branches:
      - KNN-taha

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    environment: docker-hub-env

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build Docker image
        run: |
          docker build -t knn-recommendation-api .

      - name: Login to Docker Hub
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/KNN-taha' }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Push Docker image to Docker Hub
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/KNN-taha' }}
        run: |
          docker tag knn-recommendation-api ${{ secrets.DOCKER_HUB_USERNAME }}/knn-recommendation-api:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/knn-recommendation-api:latest
