name: Docker Build and Push

# Trigger this workflow only on push or pull request to the KNN-bouri branch
on:
  push:
    branches:
      - KNN-bouri
  pull_request:
    branches:
      - KNN-bouri

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Specify the environment where DOCKER_HUB_USERNAME and DOCKER_HUB_TOKEN are defined
    environment: docker-hub-env

    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v3
      
      # Step 2: Build the Docker image and run KNN.py inside a container
      - name: Build and train model
        run: |
          # First, build a temporary container to run KNN.py
          docker build -t knn-temp -f Dockerfile.train .
          
          # Run the training container to generate model files
          docker run --name knn-trainer knn-temp
          
          # Copy the generated model files from the container
          docker cp knn-trainer:/app/model.pkl ./model.pkl
          docker cp knn-trainer:/app/data.pkl ./data.pkl
          
          # Verify model files were created
          ls -la model.pkl data.pkl
          
          # Remove temporary container
          docker rm knn-trainer
      
      # Step 3: Build the final Docker image with pre-trained model
      - name: Build application Docker image
        run: |
          docker build -t knn-recommendation-system -f Dockerfile.app .

      # Step 4: Log in to Docker Hub
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/KNN-bouri'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Step 5: Push the Docker image to Docker Hub
      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/KNN-bouri'
        run: |
          docker tag knn-recommendation-system ${{ secrets.DOCKER_HUB_USERNAME }}/knn-recommendation-api:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/knn-recommendation-api:latest
          echo "Successfully pushed: ${{ secrets.DOCKER_HUB_USERNAME }}/knn-recommendation-api:latest"