name: CI/CD Pipeline

on:
  push:
    branches:
      - Nadia-KNN
  pull_request:
    branches:
      - Nadia-KNN

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies
       run: |
    ls -al  # Pour déboguer et vérifier que requirements.txt est bien là
    pip install --upgrade pip
    pip install -r requirements.txt



      - name: Add project root to PYTHONPATH
        run: echo "PYTHONPATH=$(pwd)" >> $GITHUB_ENV

      - name: Run unit tests
        run: pytest testApi.py --maxfail=1 --disable-warnings -q

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Build Docker image
        run: docker build -t my-recommender -f dockerfile .

      - name: Run Docker container
        run: docker run -d --name recommender-container -p 8001:8001 my-recommender

      - name: Wait for FastAPI to start
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:8001/docs; then
              echo "FastAPI is up!"
              exit 0
            fi
            echo "Waiting for FastAPI..."
            sleep 5
          done
          echo "FastAPI did not start in time."
          docker logs recommender-container
          exit 1

      - name: Check running container
        run: docker ps -a

      - name: Run API test inside container
        run: docker exec recommender-container python testApi.py
