name: Docker Build and Push

# Trigger this workflow only on push or pull request to the KNN-bouri branch
on:
  push:
    branches:
      - Bouri-project
  pull_request:
    branches:
      - Bouri-project

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
    
      - name: Run training code
        run: |
          echo "Run python code"
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          python recommender.py

  Build-api-image:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
  
      - name: Build code
        run: |
          # First, build a temporary container to run app.py
          docker build -t recommendation-api -f Dockerfile.api .
      
      # Step 3: Build all Docker images
      - name: Build Frontend docker image
        run: |
          # Build Frontend image
          docker build -t recommendation -f Dockerfile.frontend .
          echo "Successufuly finish process"
          