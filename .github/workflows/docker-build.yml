name: Docker Build and Push

on:
  push:
    branches:
      - KNN-bouri
  pull_request:
    branches:
      - KNN-bouri

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Step 3: Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run model training script
      - name: Train model
        run: python KNN.py  # Replace with your actual script

      # Step 5: Upload trained model artifacts
      - name: Upload model artifacts
        uses: actions/upload-artifact@v2
        with:
          name: model-files
          path: |
            model.pkl
            data.pkl

      # Step 6: Build Docker image
      - name: Build Docker image
        run: docker build -t knn-recommendation-system .

      # Step 7: Log in to Docker Hub (only on push to KNN-bouri)
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/KNN-bouri'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Step 8: Push Docker image (only on push to KNN-bouri)
      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/KNN-bouri'
        run: |
          docker tag knn-recommendation-system ${{ secrets.DOCKER_HUB_USERNAME }}/knn-recommendation-system:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/knn-recommendation-system:latest
