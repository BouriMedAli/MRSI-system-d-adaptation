name: CI/CD Pipeline

on:
  push:
    branches:
      - Nadia-KNN
  pull_request:
    branches:
      - Nadia-KNN

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Debug - List files
        run: ls -al

      - name: Install Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.9'

     - name: Install dependencies
        run: |
       pip install --upgrade pip
       pip install -r app/requirements.txt
- name: Debug - List root files
  run: ls -al

- name: Debug - List app files
  run: ls -al app  # à adapter si besoin


      - name: Add project root to PYTHONPATH
        run: echo "PYTHONPATH=$(pwd)" >> $GITHUB_ENV

      - name: Run unit tests
        run: pytest testApi.py --maxfail=1 --disable-warnings -q

  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t my-recommender -f Dockerfile .

      - name: Run Docker container
        run: docker run -d --name recommender-container -p 8001:8001 my-recommender

      - name: Wait for FastAPI to start
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:8001/docs; then
              echo "FastAPI is up!"
              exit 0
            fi
            echo "Waiting for FastAPI..."
            sleep 5
          done
          echo "FastAPI did not start in time."
          docker logs recommender-container
          exit 1

      - name: Check running container
        run: docker ps -a

      - name: Debug - Check files in container
        run: docker exec recommender-container ls -al

      - name: Run API test inside container
        run: docker exec recommender-container python testApi.py
