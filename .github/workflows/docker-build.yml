name: Build and Deploy Docker Image

on:
  push:
    branches:
      - Nadia-KNN
  pull_request:
    branches:
      - Nadia-KNN

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    
    steps:
      # Étape 1: Checkout du code source
      - name: Checkout repository
        uses: actions/checkout@v3

      # Étape 2: Installer Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Étape 3: Configurer Python (assurez-vous que la version de Python est correcte)
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.9'

      # Étape 4: Installer les dépendances Python
      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt

      # Étape 5: Vérifier si le fichier Dockerfile existe dans le bon répertoire
      - name: Check if Dockerfile exists
        run: |
          if [ ! -f Dockerfile ]; then
            echo "Dockerfile not found!" && exit 1
          fi

      # Étape 6: Construire l'image Docker
      - name: Build Docker image
        run: docker build -t recommandation_system .

      # Étape 7: Lancer le conteneur Docker
      - name: Run Docker container
        run: docker run -d -p 8000:8000 --name recommandation_container recommandation_system

      # Étape 8: Attendre que FastAPI soit prêt
      - name: Wait for FastAPI to be ready
        run: |
          for i in {1..30}; do
            curl --output /dev/null --silent --head --fail http://localhost:8000/ && break
            sleep 2
          done

      # Étape 9: Tester l'API
      - name: Test API
        run: |
          curl -X 'GET' 'http://localhost:8000/' -H 'accept: application/json'

      # Étape 10: Nettoyer le conteneur Docker
      - name: Clean up Docker container
        run: |
          docker stop recommandation_container
          docker rm recommandation_container
