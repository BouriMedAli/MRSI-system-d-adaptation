name: Docker Build and Push

on:
  push:
    branches: [ Nadia-KNN ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ Nadia-KNN ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bourimedali/msri-system-adaptation/fastapi-knn  # Converti en minuscules
  DOCKERFILE_PATH: .

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.DOCKERFILE_PATH }}
          file: ${{ env.DOCKERFILE_PATH }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.prep.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test the built image
        run: |
          docker run -d -p 8000:8000 --name fastapi-test ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          echo "Waiting for container to start..."
          sleep 10
          echo "Testing API endpoint..."
          curl -s http://localhost:8000/students | jq '.[0]' || true
          docker stop fastapi-test
          docker rm fastapi-test

      - name: Print image info
        run: |
          echo "Image pushed to: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Latest tag: latest"
          echo "SHA tag: ${{ github.sha }}"
