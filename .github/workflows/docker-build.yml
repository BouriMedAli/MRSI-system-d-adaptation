name: Docker Build and Push

on:
  push:
    branches:
      - KNN-bouri
    tags:
      - v*
  pull_request:
    branches:
      - KNN-bouri

env:
  IMAGE_NAME: knn-recommendation-system
  DOCKER_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Run tests
      - name: Run tests
        run: |
          python -m pytest tests/

      # Train model
      - name: Train model
        run: python KNN.py

      # Verify model artifacts
      - name: Verify artifacts
        run: |
          if [ ! -f "model.pkl" ] || [ ! -f "data.pkl" ]; then
            echo "Model artifacts not found!"
            exit 1
          fi

      # Upload trained model artifacts
      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-files
          path: |
            model.pkl
            data.pkl

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            --tag $IMAGE_NAME \
            --label "version=${GITHUB_SHA}" \
            --label "build-date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            .

      # Login to Docker Hub on main branch or tag
      - name: Login to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/KNN-bouri' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Push to Docker Hub
      - name: Push Docker image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/KNN-bouri' || startsWith(github.ref, 'refs/tags/'))
        run: |
          # Tag with SHA
          docker tag $IMAGE_NAME $DOCKER_USERNAME/$IMAGE_NAME:${GITHUB_SHA:0:7}
          
          # Tag with latest if on main branch
          if [ "${{ github.ref }}" == "refs/heads/KNN-bouri" ]; then
            docker tag $IMAGE_NAME $DOCKER_USERNAME/$IMAGE_NAME:latest
          fi
          
          # Tag with version if tag
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            docker tag $IMAGE_NAME $DOCKER_USERNAME/$IMAGE_NAME:$VERSION
          fi
          
          # Push all relevant tags
          docker push $DOCKER_USERNAME/$IMAGE_NAME --all-tags