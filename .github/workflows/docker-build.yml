name: Docker Build and Push

# Trigger this workflow only on push or pull request to the KNN-bouri branch
on:
  push:
    branches:
      - KNN-bouri
  pull_request:
    branches:
      - KNN-bouri

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Specify the environment where DOCKER_HUB_USERNAME and DOCKER_HUB_TOKEN are defined
    environment: docker-hub-env

    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/KNN-bouri'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Step 2: Build all Docker images
      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/student-recommender-backend:latest -f Dockerfile.backend .
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/student-recommender-backend:latest

      - name: Build and push api image
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/student-recommender-api:latest -f Dockerfile.api .
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/student-recommender-api:latest
          echo "Successfully pushed images to DockerHub"

      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/student-recommender-frontend:latest -f Dockerfile.frontend .
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/student-recommender-frontend:latest
          echo "Successfully pushed images to DockerHub"
