name: CI/CD Pipeline

on:
  push:
    branches:
      - Nadia-KNN
  pull_request:
    branches:
      - Nadia-KNN

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Build Docker image
        run: docker build -t nadia-knn-app .

      - name: Run Docker container
        run: docker run -d -p 8000:8000 --name nadia-knn-container nadia-knn-app

      - name: Wait for FastAPI to be ready
        run: |
          for i in {1..30}; do
            curl --output /dev/null --silent --head --fail http://localhost:8000/ && break
            sleep 2
          done

      - name: Test API
        run: |
          curl -X GET http://localhost:8000/ -H 'accept: application/json'

      - name: Clean up Docker container
        run: |
          docker stop nadia-knn-container
          docker rm nadia-knn-container
