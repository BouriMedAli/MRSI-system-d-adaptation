
name: Docker Build and Push

on:
  push:
    branches:
      - Nadia-KNN
  pull_request:
    branches:
      - Nadia-KNN

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    environment: docker-hub-env

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: |
          docker build -t nadia-knn-recommendation-system .

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/Nadia-KNN'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/Nadia-KNN'
        run: |
          docker tag nadia-knn-recommendation-system ${{ secrets.DOCKER_HUB_USERNAME }}/nadia-knn-recommendation-system:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/nadia-knn-recommendation-system:latest
