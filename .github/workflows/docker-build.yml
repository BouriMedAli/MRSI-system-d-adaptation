name: Docker Build and Push

on:
  push:
    branches:
      - KNN-bouri
  pull_request:
    branches:
      - KNN-bouri

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: python your_script_name.py  # Replace with your actual script

      - name: Upload model artifacts
        uses: actions/upload-artifact@v3
        with:
          name: model-files
          path: |
            model.pkl
            data.pkl

      - name: Build Docker image
        run: |
          docker build -t knn-recommendation-system .

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/KNN-bouri'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/KNN-bouri'
        run: |
          docker tag knn-recommendation-system ${{ secrets.DOCKER_HUB_USERNAME }}/knn-recommendation-system:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/knn-recommendation-system:latest
