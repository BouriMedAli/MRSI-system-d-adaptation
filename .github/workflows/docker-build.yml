name: Build and Deploy Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Étape 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v2

      # Étape 2: Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Étape 3: Mise en cache des couches Docker pour accélérer les builds futurs
      - name: Cache Docker layers
        uses: actions/cache@v2
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # Étape 4: Construire l'image Docker en spécifiant le chemin du Dockerfile
      - name: Build Docker image
        run: |
          docker build -f docker/Dockerfile -t nadia-knn-app .

      # Optionnel : Push Docker image vers Docker Hub ou un autre registre
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Push Docker image
        run: |
          docker push nadia-knn-app
