name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push backend image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/student-recommender-backend:latest -f Dockerfile.backend .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/student-recommender-backend:latest

    - name: Build and push api image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/student-recommender-api:latest -f Dockerfile.api .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/student-recommender-api:latest

    - name: Build and push frontend image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/student-recommender-frontend:latest -f Dockerfile.frontend .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/student-recommender-frontend:latest