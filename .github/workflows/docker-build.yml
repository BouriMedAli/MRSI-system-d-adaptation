name: Build and Test Docker

on:
  push:
    branches:
      - eya-supriseknn
  pull_request:
    branches:
      - eya-supriseknn

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker images
        run: |
          docker compose build

      - name: Start services
        run: |
          docker compose up -d

      - name: Train model
        run: |
          docker compose exec -T fastapi python train_model.py

      - name: Run generate_recommendations.py
        run: |
          docker compose exec -T fastapi python generate_recommendations.py

      - name: Copy generated files from container
        run: |
          docker cp $(docker compose ps -q fastapi):/app/students_df.pkl ./students_df.pkl
          docker cp $(docker compose ps -q fastapi):/app/model.pkl ./model.pkl

      - name: Upload generated files as artifacts
        uses: actions/upload-artifact@v3
        with:
          name: generated-files
          path: |
            students_df.pkl
            model.pkl

      - name: Test FastAPI service
        run: |
          sleep 10  # Attendre que le service démarre
          curl --fail http://localhost:8000/recommend/2 || exit 1

      - name: Test Streamlit service
        run: |
          curl --fail http://localhost:8501 || exit 1

      - name: Stop services
        run: |
          docker compose down