name: Docker Build and Push

# Trigger this workflow only on push or pull request to the KNN-bouri branch
on:
  push:
    branches:
      - KNN-bouri
  pull_request:
    branches:
      - KNN-bouri

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Specify the environment where DOCKER_HUB_USERNAME and DOCKER_HUB_TOKEN are defined
    environment: docker-hub-env

    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model
        run: python your_script_name.py

      - name: Upload model artifacts
        uses: actions/upload-artifact@v3
        with:
          name: model-files
          path: |
            model.pkl
            data.pkl
            
      # Step 2: Build the Docker image
      - name: Build Docker image
        run: |
          docker build -t knn-recommendation-system .

      # Step 3: Log in to Docker Hub
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/KNN-bouri'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Step 4: Push the Docker image to Docker Hub
      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/KNN-bouri'
        run: |
          docker tag knn-recommendation-system ${{ secrets.DOCKER_HUB_USERNAME }}/knn-recommendation-system:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/knn-recommendation-system:latest