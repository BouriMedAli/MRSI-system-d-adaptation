name: Docker Build and Push

# Trigger this workflow only on push or pull request to the KNN-bouri branch
on:
  push:
    branches:
      - KNN-bouri
  pull_request:
    branches:
      - KNN-bouri

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Specify the environment where DOCKER_HUB_USERNAME and DOCKER_HUB_TOKEN are defined
    environment: docker-hub-env

    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v3
      
      # Step 2: Build all Docker images
      - name: Build Docker images
        run: |
          # Build API image
          docker build -t recommendation-api -f Dockerfile.app .
          
          # Build frontend image
          docker build -t recommendation-frontend -f Dockerfile.front .

      # Step 3: Log in to Docker Hub
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/KNN-bouri'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Step 5: Push the Docker images to Docker Hub
      - name: Push Docker images
        if: github.event_name == 'push' && github.ref == 'refs/heads/KNN-bouri'
        run: |
          # Tag and push API image
          docker tag recommendation-api ${{ secrets.DOCKER_HUB_USERNAME }}/recommendation-api:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/recommendation-api:latest
          
          # Tag and push frontend image
          docker tag knn-recommendation-frontend ${{ secrets.DOCKER_HUB_USERNAME }}/recommendation-frontend:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/recommendation-frontend:latest
          
          echo "Successfully pushed images to DockerHub"