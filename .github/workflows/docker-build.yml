name: Docker Build and Push

# Trigger this workflow only on push or pull request to the nadia-knn branch
on:
  push:
    branches:
      - nadia-knn
  pull_request:
    branches:
      - nadia-knn

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Specify the environment where DOCKER_HUB_USERNAME and DOCKER_HUB_TOKEN are defined
    environment: docker-hub-env

    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Build the Docker image
      - name: Build Docker image
        run: |
          docker build -t nadia-knn .

      # Step 3: Log in to Docker Hub
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/nadia-knn'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Step 4: Push the Docker image to Docker Hub
      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/nadia-knn'
        run: |
          docker tag nadia-knn ${{ secrets.DOCKER_HUB_USERNAME }}/nadia-knn:latest
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/nadia-knn:latest
