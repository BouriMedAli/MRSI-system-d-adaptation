name: Docker Build and Push

# Trigger this workflow only on push or pull request to the KNN-bouri branch
on:
  push:
    branches:
      - KNN-bouri
  pull_request:
    branches:
      - KNN-bouri

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Specify the environment where DOCKER_HUB_USERNAME and DOCKER_HUB_TOKEN are defined
    environment: docker-hub-env

    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up metadata for Docker image
      - name: Set up Docker metadata
        id: meta
        run: |
          echo "image_name=student-knn-recommender" >> $GITHUB_ENV
          echo "image_tag=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV

      # Step 3: Build the Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ env.image_name }}:${{ env.image_tag }} .
          docker tag ${{ env.image_name }}:${{ env.image_tag }} ${{ env.image_name }}:latest

      # Step 4: Log in to Docker Hub
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/KNN-bouri'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Step 5: Push the Docker image to Docker Hub with clear naming
      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/KNN-bouri'
        run: |
          # Tag with both versioned tag and latest
          docker tag ${{ env.image_name }}:${{ env.image_tag }} ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.image_name }}:${{ env.image_tag }}
          docker tag ${{ env.image_name }}:${{ env.image_tag }} ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.image_name }}:latest
          
          # Push both tags
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.image_name }}:${{ env.image_tag }}
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.image_name }}:latest