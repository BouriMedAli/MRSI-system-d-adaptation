<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Algorithme Co-Clustering - Recommandation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <div class="card mt-5">
      <h1 class="card-header text-center">🔍 Algorithme Co-Clustering - Regroupement</h1>
      <div class="card-body">
        <form id="co-clustering-form">
          <div class="mb-3">
            <label for="competences" class="form-label">Compétences</label>
            <select id="competences" class="form-select" multiple>
              <option>Électronique</option>
              <option>Science</option>
              <option>Python</option>
              <option>Marketing</option>
              <option>IA</option>
              <option>Design</option>
              <option>Data</option>
              <option>Blockchain</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="interets" class="form-label">Centres d'intérêt</label>
            <select id="interets" class="form-select" multiple>
              <option>Entrepreneuriat</option>
              <option>Hackathon</option>
              <option>Jeux</option>
              <option>Musique</option>
              <option>Robotique</option>
              <option>Écologie</option>
              <option>Vidéo</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="travaux" class="form-label">Nombre de Travaux Collaboratifs</label>
            <input type="number" id="travaux" class="form-control" required min="0" placeholder="Entrez un nombre..." />
          </div>
          <div class="mb-3">
            <label for="k-value" class="form-label">Nombre de classes (k)</label>
            <input type="number" id="k-value" class="form-control" required min="2" placeholder="Entrez un nombre de classes..." />
          </div>
          <button type="submit" class="btn btn-primary w-100">Lancer la recommandation</button>
        </form>
      </div>
    </div>

    <div class="card mt-5">
      <h3>📋 Résultats de Co-Clustering</h3>
      <table class="table table-hover" id="result-table">
        <thead class="table-light">
          <tr>
            <th>Nom</th>
            <th>Compétences</th>
            <th>Centres d'intérêt</th>
            <th>Classe</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="card mt-5">
      <h4>📊 Visualisation des Clusters</h4>
      <canvas id="cluster-pie-chart" height="100"></canvas>

      <h4 class="mt-5">💠 Répartition des Étudiants par Cluster</h4>
      <canvas id="scatter-chart" height="200"></canvas>
    </div>
  </div>

  <script>
    document.getElementById("co-clustering-form").addEventListener("submit", async function (e) {
      e.preventDefault();

      const competences = Array.from(document.getElementById("competences").selectedOptions).map(o => o.value.trim());
      const interets = Array.from(document.getElementById("interets").selectedOptions).map(o => o.value.trim());
      const travaux = parseInt(document.getElementById("travaux").value);
      const k = parseInt(document.getElementById("k-value").value);

      if (isNaN(travaux) || travaux < 0 || isNaN(k) || k < 2) {
        alert("Veuillez entrer des valeurs valides.");
        return;
      }

      try {
        const response = await fetch("/co-clustering/recommend", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ competences, interets, travaux, k })
        });
        const data = await response.json();
        afficherResultats(data);
      } catch (err) {
        alert("Erreur : " + err.message);
      }
    });

    function afficherResultats(data) {
  console.log("Données reçues :", data);

  if (!data || !Array.isArray(data.clusters)) {
    alert("Erreur : le format des données reçues est invalide !");
    return;
  }

  const tableBody = document.querySelector("#result-table tbody");
  tableBody.innerHTML = "";

  const pieLabels = [], pieValues = [], scatterData = [];
  const colors = ['#ff6f61', '#6b5b95', '#88b04b', '#f0ad4e', '#5bc0de', '#d9534f', '#5cb85c', '#f0ad4e'];

  data.clusters.forEach((cluster, index) => {
    cluster.students.forEach((student) => {
      const row = tableBody.insertRow();
      row.insertCell(0).textContent = student.nom;
      row.insertCell(1).textContent = student.competences.join(", ");
      row.insertCell(2).textContent = student.interets.join(", ");
      row.insertCell(3).textContent = `Cluster ${index + 1}`;

      pieLabels.push(`Cluster ${index + 1}`);
      pieValues.push(cluster.students.length);

      scatterData.push({
        x: student.similarity,
        y: student.similarity,
        label: student.nom
      });
    });
  });

  // ... (chart creation reste inchangé)

      // Mise à jour des graphiques
      new Chart(document.getElementById("cluster-pie-chart"), {
        type: "pie",
        data: {
          labels: pieLabels,
          datasets: [{
            data: pieValues,
            backgroundColor: colors.slice(0, pieValues.length)
          }]
        }
      });

      new Chart(document.getElementById("scatter-chart"), {
        type: "scatter",
        data: {
          datasets: [{
            label: "Similarité par Cluster",
            data: scatterData,
            backgroundColor: "#ff9a8b",
            borderColor: "#f0f0f0",
            borderWidth: 2
          }]
        },
        options: {
          scales: {
            x: { beginAtZero: true },
            y: { beginAtZero: true }
          }
        }
      });
    }
  </script>
</body>
</html>
