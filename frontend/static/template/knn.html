<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Algorithme KNN - Recommandation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <div class="card mt-5">
      <h1 class="card-header text-center">🔍 Algorithme KNN - Similarité</h1>
      <div class="card-body">
        <form id="knn-form">
          <div class="mb-3">
            <label for="competences" class="form-label">Compétences</label>
            <select id="competences" class="form-select" multiple>
              <option>Électronique</option>
              <option>Science</option>
              <option>Python</option>
              <option>Marketing</option>
              <option>IA</option>
              <option>Design</option>
              <option>Data</option>
              <option>Blockchain</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="Centres_d_Interet" class="form-label">Centres d'intérêt</label>
            <select id="Centres_d_Interet" class="form-select" multiple>
              <option>Entrepreneuriat</option>
              <option>Hackathon</option>
              <option>Jeux</option>
              <option>Musique</option>
              <option>Robotique</option>
              <option>Écologie</option>
              <option>Vidéo</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="travaux" class="form-label">Nombre de Travaux Collaboratifs</label>
            <input type="number" id="travaux" class="form-control" required min="0" placeholder="Entrez un nombre..." />
          </div>
          <button type="submit" class="btn btn-primary w-100">Lancer la recommandation</button>
        </form>
      </div>
    </div>

    <div class="card mt-5">
      <h3>📋 Résultats</h3>
      <table class="table table-hover" id="result-table">
        <thead class="table-light">
          <tr>
            <th>Nom</th>
            <th>Compétences</th>
            <th>Centres d'intérêt</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="card mt-5">
      <h4>🎯 Graphe Circulaire</h4>
      <canvas id="pie-chart" height="100"></canvas>

      <h4 class="mt-5">💠 Nuage de Similarité</h4>
      <canvas id="scatter-chart" height="200"></canvas>
    </div>
  </div>

 <!-- À garder identique : ton HTML jusqu'à </form> -->

<!-- Ensuite, assure-toi d’avoir ces 2 canvas dans la dernière carte : -->
<canvas id="histogram-comp-chart" height="100"></canvas>
<canvas id="histogram-int-chart" height="100"></canvas>

<!-- ✅ SCRIPT corrigé -->
<script>
  document.getElementById("knn-form").addEventListener("submit", async function (e) {
    e.preventDefault();

    // Récupération des valeurs des champs du formulaire
    const competences = Array.from(document.getElementById("competences").selectedOptions).map(o => o.value.trim());
    const Centres_d_Interet = Array.from(document.getElementById("Centres_d_Interet").selectedOptions).map(o => o.value.trim());
    const travaux = parseInt(document.getElementById("travaux").value);

    // Vérification du nombre de travaux collaboratifs
    if (isNaN(travaux) || travaux < 0) {
      alert("Veuillez entrer un nombre valide de travaux collaboratifs.");
      return;
    }

    // Données envoyées dans le body de la requête
    const payload = {
      competences: competences,
      Centres_d_Interet: Centres_d_Interet,
      travaux: travaux
    };

    try {
      // Envoi de la requête POST à l'API
      const response = await fetch("/knn", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      // Vérification de la réponse
      const data = await response.json();

      if (data.resultats && Array.isArray(data.resultats)) {
        // Affichage des résultats dans le tableau
        afficherResultats(data.resultats);
      } else {
        alert("Données de résultats manquantes ou invalides.");
        return;
      }

      // Affichage des graphiques
      afficherGraphiques(data.pie_data, data.scatter_data, data.histogram_data);

    } catch (err) {
      alert("Erreur : " + err.message);
      console.error(err);
    }
  });

  // Fonction pour afficher les résultats dans le tableau
  function afficherResultats(resultats) {
    const tableBody = document.querySelector("#result-table tbody");
    tableBody.innerHTML = "";

    resultats.forEach((item) => {
      const row = tableBody.insertRow();
      row.insertCell(0).textContent = item.nom;
      row.insertCell(1).textContent = item.competences.join(", ");
      row.insertCell(2).textContent = item.Centres_d_Interet.join(", ");
      row.insertCell(3).textContent = item.similarity + "%";
    });
  }

  // Fonction pour afficher les graphiques
  function afficherGraphiques(pieData, scatterData, histogramData) {
    // Graphique circulaire
    new Chart(document.getElementById("pie-chart"), {
      type: "pie",
      data: {
        labels: pieData.labels,
        datasets: [{
          data: pieData.values,
          backgroundColor: ['#ff6f61', '#6b5b95', '#88b04b']
        }]
      }
    });

    // Nuage de points (scatter)
    new Chart(document.getElementById("scatter-chart"), {
      type: "scatter",
      data: {
        datasets: [{
          label: "Similarité",
          data: scatterData.x.map((x, i) => ({
            x: x,
            y: scatterData.y[i],
            label: scatterData.labels[i]
          })),
          backgroundColor: "#ff9a8b"
        }]

      },
      options: {
        scales: {
          x: { title: { display: true, text: "Coordonnée X" } },
          y: { title: { display: true, text: "Coordonnée Y" } }
        }
      }
    });

    // Histogramme des compétences
    new Chart(document.getElementById("histogram-comp-chart"), {
      type: "bar",
      data: {
        labels: histogramData.competences,
        datasets: [{
          label: "Compétences",
          data: histogramData.competences.map((_, i) => histogramData.valeursComp[i]),
          backgroundColor: "#88b04b"
        }]
      }
    });

    // Histogramme des centres d'intérêt
    new Chart(document.getElementById("histogram-int-chart"), {
      type: "bar",
      data: {
        labels: histogramData.Centres_d_Interet,
        datasets: [{
          label: "Centres d'Intérêt",
          data: histogramData.Centres_d_Interet.map((_, i) => histogramData.valeursInteret[i]),
          backgroundColor: "#6b5b95"
        }]
      }
    });
  }
</script>


</body>
</html>
