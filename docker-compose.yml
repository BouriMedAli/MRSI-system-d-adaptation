version: '3'

services:
  # FastAPI application service
  app:
    image: mohamedalibouri/knn-recommendation-api:latest
    ports:
      - "8000:8000"
    volumes:
      - ./model:/app/model
    networks:
      - recommender-network

  # Streamlit frontend service
  frontend:
    image: mohamedalibouri/knn-recommendation-frontend:latest
    ports:
      - "8501:8501"
    depends_on:
      - app
    networks:
      - recommender-network

networks:
  recommender-network:
    driver: bridge