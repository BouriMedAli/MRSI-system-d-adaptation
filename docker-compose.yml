version: '3'

services:
  # FastAPI application service
  app:
    image: mohamedalibouri/recommender-api:latest
    ports:
      - "8000:8000"
    volumes:
      - ./model:/app/model
    depends_on:
      train:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - recommender-network

  # Streamlit frontend service
  frontend:
    image: mohamedalibouri/recommender-frontend:latest
    ports:
      - "8501:8501"
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    networks:
      - recommender-network

networks:
  recommender-network:
    driver: bridge