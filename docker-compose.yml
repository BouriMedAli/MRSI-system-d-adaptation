version: '3.8'

services:
  model-trainer:
    image: mohamedalibouri/knn-recommendation-api:latest
    container_name: knn-model-trainer
    command: python KNN.py
    volumes:
      - model-data:/app
    environment:
      - LOG_LEVEL=info

  api-service:
    image: mohamedalibouri/knn-recommendation-api:latest
    container_name: knn-recommendation-api
    command: python app.py
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - model-data:/app
    environment:
      - LOG_LEVEL=info
    depends_on:
      - model-trainer

volumes:
  model-data: